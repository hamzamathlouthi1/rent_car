server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ {
    client_max_body_size 3m;
    proxy_pass http://user-service:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /api/cars { proxy_pass http://cars-service:8081; }
  location /api/cars/ { proxy_pass http://cars-service:8081; }
  location /api/admin/cars {
    client_max_body_size 50m;
    proxy_pass http://cars-service:8081;
    proxy_set_header Authorization $http_authorization;
  }
  location /api/reservations {
    client_max_body_size 50m;
    proxy_pass http://reservations-service:8082;
    proxy_set_header Authorization $http_authorization;
  }
  location /api/admin/reservations { proxy_pass http://reservations-service:8082; proxy_set_header Authorization $http_authorization; }
  location / { try_files $uri $uri/ /index.html; }
}
