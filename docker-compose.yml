services:
  user-service:
    build:
      context: ./backend/user-service
    environment:
      DATABASE_URL: ${NEON_DATABASE_URL}
      DATABASE_USERNAME: ${NEON_DATABASE_USERNAME}
      DATABASE_PASSWORD: ${NEON_DATABASE_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@fmrent.tn}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-this-admin-password}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME:-FM}
      ADMIN_LAST_NAME: ${ADMIN_LAST_NAME:-Admin}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-production-2026}
      JWT_EXPIRATION_MS: 86400000
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 10
  cars-service:
    build:
      context: ./backend/cars-service
    environment:
      CAR_DATABASE_URL: ${NEON_DATABASE_URL}
      CAR_DATABASE_USERNAME: ${NEON_DATABASE_USERNAME}
      CAR_DATABASE_PASSWORD: ${NEON_DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-production-2026}
      IMAGEKIT_URL_ENDPOINT: ${IMAGEKIT_URL_ENDPOINT}
      IMAGEKIT_PUBLIC_KEY: ${IMAGEKIT_PUBLIC_KEY}
      IMAGEKIT_PRIVATE_KEY: ${IMAGEKIT_PRIVATE_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 10
  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      user-service:
        condition: service_healthy
      cars-service:
        condition: service_healthy
      reservations-service:
        condition: service_healthy
    restart: unless-stopped
  reservations-service:
    build:
      context: ./backend/reservations-service
    environment:
      RESERVATION_DATABASE_URL: ${NEON_DATABASE_URL}
      RESERVATION_DATABASE_USERNAME: ${NEON_DATABASE_USERNAME}
      RESERVATION_DATABASE_PASSWORD: ${NEON_DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-production-2026}
      CARS_SERVICE_URL: http://cars-service:8081
      IMAGEKIT_PRIVATE_KEY: ${IMAGEKIT_PRIVATE_KEY}
    depends_on:
      cars-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8082/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 10
