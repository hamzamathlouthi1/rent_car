server:
  port: 8081
spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  datasource:
    url: ${CAR_DATABASE_URL}
    username: ${CAR_DATABASE_USERNAME}
    password: ${CAR_DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.default_schema: cars_service
  flyway:
    enabled: true
    table: flyway_schema_history
    schemas: cars_service
    default-schema: cars_service
    create-schemas: true
app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-key-32chars}
imagekit:
  url-endpoint: ${IMAGEKIT_URL_ENDPOINT}
  public-key: ${IMAGEKIT_PUBLIC_KEY}
  private-key: ${IMAGEKIT_PRIVATE_KEY}
