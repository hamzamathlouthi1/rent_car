server:
  port: 8080
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      minimum-idle: ${DATABASE_MIN_IDLE:2}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.default_schema: user_service
  flyway:
    enabled: true
    table: flyway_schema_history
    schemas: user_service
    default-schema: user_service
    create-schemas: true
    locations: classpath:db/migration
    validate-migration-naming: true
app:
  admin:
    email: ${ADMIN_EMAIL:admin@fmrent.tn}
    password: ${ADMIN_PASSWORD:change-this-admin-password}
    first-name: ${ADMIN_FIRST_NAME:FM}
    last-name: ${ADMIN_LAST_NAME:Admin}
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-key-32chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
